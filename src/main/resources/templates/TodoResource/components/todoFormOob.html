{@String content}
{@String validationError}
<div id="todo-form" class="mb-6" hx-swap-oob="outerHTML">
    <form action="/todos" method="post" hx-post="/todos" hx-swap="none"><div class="field has-addons"><div class="control is-expanded"><input autofocus class="input{#if validationError} is-danger{/if}" name="content" maxlength="1000" placeholder="New todo" value="{content}"></div><div class="control"><button class="button is-primary">Add</button></div></div>{#if validationError}<p class="help is-danger">{validationError}</p>{/if}</form>
</div>
