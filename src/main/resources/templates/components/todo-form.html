<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
<div th:fragment="form" id="todo-form" class="mb-6">
    <form action="/todos" method="post" hx-post="/todos" hx-swap="none">
        <div class="field has-addons">
            <div class="control is-expanded">
                <input autofocus class="input"
                       th:classappend="${validationError != null and !validationError.isBlank()} ? ' is-danger' : ''"
                       name="content" placeholder="New todo"
                       th:value="${content}"></div>
            <div class="control">
                <button class="button is-primary">Add</button>
            </div>
        </div>
        <p th:if="${validationError != null and !validationError.isBlank()}" class="help is-danger"
           th:text="${validationError}"></p></form>
</div>
</body>
</html>
