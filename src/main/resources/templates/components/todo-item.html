<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
<article th:fragment="item" th:id="|todo-${todo.id}|" class="card mb-3">
    <div class="card-content py-4">
        <div class="is-flex is-align-items-center is-justify-content-space-between" style="gap: 1rem">
            <div>
                <p th:if="${completed}">
                    <del th:text="${todo.content}"></del>
                </p>
                <p th:unless="${completed}" th:text="${todo.content}"></p>
                <p class="is-size-7 has-text-grey" th:text="|created by: ${todo.createdBy}|">created by:</p></div>
            <div th:if="${completed}" class="buttons are-small">
                <form th:action="@{/todos/{id}/undone(id=${todo.id})}" method="post" th:hx-post="@{/todos/{id}/undone(id=${todo.id})}"
                      hx-target="#active-todo-list" hx-swap="outerHTML">
                    <button class="button">Undo</button>
                </form>
                <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post" th:hx-post="@{/todos/{id}/delete(id=${todo.id})}"
                      hx-target="#active-todo-list" hx-swap="outerHTML">
                    <button class="button is-danger is-light">Delete</button>
                </form>
            </div>
            <form th:unless="${completed}" th:action="@{/todos/{id}/done(id=${todo.id})}" method="post"
                  th:hx-post="@{/todos/{id}/done(id=${todo.id})}" hx-target="#active-todo-list" hx-swap="outerHTML">
                <button class="button is-primary is-small">Done</button>
            </form>
        </div>
    </div>
</article>
</body>
</html>
